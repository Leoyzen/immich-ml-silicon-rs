[package]
name = "immich-ml-vision"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-vision = { version = "0.3.2", features = ["objc2-core-foundation"] }
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
async-trait = { workspace = true }
tokio = { workspace = true }
immich-ml-backends = { path = "../backends" }

[lib]
name = "immich_ml_vision"
path = "src/lib.rs"
